name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Set package versions
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm version "$VERSION" --no-git-tag-version --allow-same-version --prefix app

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:prod && npx electron-builder build --${{ matrix.platform }} --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cu-exchange-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
